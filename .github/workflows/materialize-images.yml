name: Materialize Repository Images

on:
  push:
    branches: [main]
    paths:
      - "upload_tmp/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          cat upload_tmp/banner.part* | tr -d '\n\r' | base64 -d > images/gunslinger-enhanced-pc-patch-banner.jpg
          cat upload_tmp/cover.part*  | tr -d '\n\r' | base64 -d > images/gunslinger-enhanced-pc-patch-cover.jpg

          echo "291fab563f77126773d563700504b42c9ef75f0855c50853d056549e99a6a1c7  images/gunslinger-enhanced-pc-patch-banner.jpg" | sha256sum -c -
          echo "badbee6980208556937574dfe5c8f94eae83be3c95872e4e7fed633ca72addaa  images/gunslinger-enhanced-pc-patch-cover.jpg" | sha256sum -c -

      - name: Add images to README
        shell: python
        run: |
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          marker = "# Call of Juarez: Gunslinger - Enhanced PC Patch\n"
          block = """
<p align="center">
  <img src="images/gunslinger-enhanced-pc-patch-banner.jpg" alt="Call of Juarez: Gunslinger Enhanced PC Patch banner">
</p>

<p align="center">
  <img src="images/gunslinger-enhanced-pc-patch-cover.jpg" alt="Call of Juarez: Gunslinger Enhanced PC Patch cover" width="520">
</p>

"""
          if "images/gunslinger-enhanced-pc-patch-banner.jpg" not in s:
              s = s.replace(marker, marker + "\n" + block, 1)
              p.write_text(s, encoding="utf-8")

      - name: Commit images and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upload_tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images README.md
          git rm -r --ignore-unmatch upload_tmp || true
          git commit -m "Add final Gunslinger mod artwork" || exit 0
          git push
