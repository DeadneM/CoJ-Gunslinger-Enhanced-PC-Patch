name: Publish Patcher Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release/PUBLISH"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate installer designation
        shell: pwsh
        run: |
          $manifest = Get-Content HASHES_BUILD45.json -Raw | ConvertFrom-Json

          $designation = [string]$manifest.designation
          $patcher = [int]$manifest.versions.patcher
          $steam = [int]$manifest.versions.steam
          $gog = [int]$manifest.versions.gog
          $expected = "v$($patcher)Pv$($steam)Sv$($gog)G"
          $releaseDesignation = (Get-Content release/VERSION -Raw).Trim()
          $source = Get-Content installer/COJ_Gunslinger_Patcher.py -Raw

          if ($designation -ne $expected) { throw "Manifest designation mismatch: expected $expected, got $designation" }
          if ($designation -notmatch '^v\d+Pv\d+Sv\d+G$') { throw "Invalid installer designation: $designation" }
          if ($releaseDesignation -ne $designation) { throw "release/VERSION mismatch: expected $designation, got $releaseDesignation" }
          if ($source -notmatch "PATCHER_VERSION\s*=\s*$patcher(\D|$)") { throw "PATCHER_VERSION in installer source does not match manifest." }
          if ($source -notmatch "STEAM_VERSION\s*=\s*$steam(\D|$)") { throw "STEAM_VERSION in installer source does not match manifest." }
          if ($source -notmatch "GOG_VERSION\s*=\s*$gog(\D|$)") { throw "GOG_VERSION in installer source does not match manifest." }

          $publishRequest = (Get-Content release/PUBLISH -Raw).Trim()
          if ($publishRequest -ne $designation) { throw "release/PUBLISH mismatch: expected $designation, got $publishRequest" }

          $exeName = "COJ_Gunslinger_Patcher_$designation"
          "DESIGNATION=$designation" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATCHER_VERSION=$patcher" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STEAM_VERSION=$steam" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GOG_VERSION=$gog" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$designation" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Generate Windows version metadata
        run: python installer/make_version_info.py

      - name: Build standalone release executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "$env:EXE_NAME" `
            --version-file installer/version_info.txt `
            installer/COJ_Gunslinger_Patcher.py

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $exe = "dist/$env:EXE_NAME.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:EXE_NAME.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          "RELEASE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "dist/$env:EXE_NAME.exe"
          $notes = @"
          # Enhanced PC Patch $env:DESIGNATION

          Unified Windows patcher for Call of Juarez: Gunslinger.

          - Patcher generation: v$env:PATCHER_VERSION
          - Steam payload: v$env:STEAM_VERSION
          - GOG payload: v$env:GOG_VERSION
          - Automatically detects supported Steam or GOG source files
          - Uses embedded direct COJDP1 deltas
          - Verifies exact source hashes before reconstruction
          - Creates backups before installation
          - Verifies target hashes before and after replacement
          - Contains no retail game executable or retail Data0.pak
          - Patcher SHA-256: $env:RELEASE_SHA256

          Source and build workflow are included in this repository.
          "@

          gh release view $env:TAG --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $exe dist/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
          } else {
            gh release create $env:TAG $exe dist/SHA256SUMS.txt --repo ${{ github.repository }} --target "$env:GITHUB_SHA" --title "Enhanced PC Patch $env:DESIGNATION" --notes $notes
          }

      - name: Remove superseded v45 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TAG -eq "v45") { exit 0 }

          gh release view v45 --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v45 --cleanup-tag --yes --repo ${{ github.repository }}
            Write-Host "Removed superseded v45 release and tag."
          } else {
            Write-Host "Superseded v45 release is already absent."
          }
