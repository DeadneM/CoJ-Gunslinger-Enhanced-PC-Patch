name: Build Windows Patcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "release/VERSION"
      - "HASHES_BUILD45.json"
      - ".github/workflows/build-patcher.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read installer designation
        shell: pwsh
        run: |
          $manifest = Get-Content HASHES_BUILD45.json -Raw | ConvertFrom-Json
          $designation = [string]$manifest.designation
          if ($designation -notmatch '^v\d+Pv\d+Sv\d+G$') {
            throw "Invalid installer designation in HASHES_BUILD45.json: $designation"
          }
          $exeName = "COJ_Gunslinger_Patcher_$designation"
          "DESIGNATION=$designation" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Generate Windows version metadata
        run: python installer/make_version_info.py

      - name: Build standalone patcher
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "$env:EXE_NAME" `
            --version-file installer/version_info.txt `
            installer/COJ_Gunslinger_Patcher.py

      - name: SHA-256
        shell: pwsh
        run: |
          $exe = "dist/$env:EXE_NAME.exe"
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload patcher
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}.exe
          if-no-files-found: error
          compression-level: 0
